# DocOS-rag 配置文件
# 所有路径如果是相对路径,都相对于项目根目录解析

embedding:
  model: BAAI/bge-small-zh-v1.5   # 本地中文向量模型
  device: mps                     # Apple 芯片用 mps(NVIDIA 用 cuda,其余用 cpu)
  # bge v1.5 系列在做检索查询时推荐加这个前缀(文档内容本身不加)
  query_prefix: "为这个句子生成表示以用于检索相关文章："

chunking:
  chunk_tokens: 256               # 每个片段的最大 token 数(BGE 上限 512,留余量)
  overlap_tokens: 32              # 相邻片段之间的重叠 token 数

retrieval:
  top_k: 4                        # 最终返回给 LLM 的片段数
  hybrid: true                    # true=混合检索(BM25 关键词 + 向量语义);false=纯向量
  rrf_k: 60                       # RRF 融合常数(只影响排名,不依赖分数尺度)
  rerank: true                    # 用交叉编码器对候选精排(两阶段检索)
  rerank_model: BAAI/bge-reranker-base   # 交叉编码器模型
  rerank_top_n: 12                # 先粗召回多少个候选,精排后再取 top_k

llm:
  provider: deepseek              # openai | deepseek | anthropic
  model: deepseek-chat            # deepseek-chat(V3)或 deepseek-reasoner(R1)
  temperature: 0.2
  max_tokens: 1024

paths:
  raw_dir: data/raw               # 原始 Markdown 文档目录
  index_dir: index                # 构建出的向量索引目录(可随时删除重建)
